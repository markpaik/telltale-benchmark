      SKELETON sample/white-paper-01
      format: white-paper
      words: 1180

      OUTLINE
      H1: Identifier Integrity
      PARA: 82w | Three repair paths are available and none of them is cheap.   [this is the closing paragraph; it is printed in full below]
      H2: Options

      FIRST PARAGRAPH
      Three repair paths are available and none of them is cheap. They differ mainly in who absorbs the disruption.

      LAST PARAGRAPH [the same closing paragraph already listed in the outline above, reprinted in full — its appearance here is not a second occurrence in the document]
      All three options end in the same place. The question is only how much downtime the district is willing to take at once.

      TABLES
      [table 1: 5 lines]
      | Option | Discussion |
      |---|---|
      | Normalize on write | This is the cleanest option and the most disruptive, because every system that writes the identifier has to change in the same release window. |
      | Normalize on read | Cheaper to deploy but it leaves the bad data in place, which means every future consumer inherits the problem. |
      | Do nothing | Reconciliation continues to cost about two staff days a month and the error rate grows with each new integration. |

