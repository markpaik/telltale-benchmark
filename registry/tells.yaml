- id: rht.fragment-emphasis
  name: fragment for emphasis
  category: syntactic
  scope: general
  formats: null
  detection:
    method: judge
    unit: count
    rubric: |
      A span exhibits FRAGMENT EMPHASIS when BOTH criteria hold:
      (a) the span is punctuated as a sentence — it begins after a terminal mark and ends in a period,
          question mark, or exclamation point — but lacks a finite verb, a subject, or both
          ("Not anymore." / "Every single school." / "A real problem."), AND
      (b) its position shows it is there for emphasis: it follows or precedes a complete sentence whose
          content it intensifies, restates, or undercuts.
      EXCLUSIONS:
      (x) headings, subheadings, and titles do not qualify, including bolded run-in headings.
      (y) list items, table cells, and bullet text do not qualify.
      (z) salutations, sign-offs, captions, labels, bylines, dates, and callout tags ("Note:", "Action:")
          do not qualify.
      (w) a fragment inside quoted speech attributed to someone other than the writer does not qualify.
      Evidence to extract: quote the fragment; quote the adjacent complete sentence it leans on; name
      which element is missing (subject, finite verb, or both).
    rubric_version: 1
    judge_view: chunk
  examples:
  - Nobody caught the error for six weeks. Six weeks.
  - The fix took one afternoon. One afternoon.
  counter_examples: []
  provenance:
    source: seed
    added: 2026-07-28
    run_id: null
    evidence: literature
  status: active
  weight: 1.0
  notes: null
- id: rht.from-x-to-y
  name: from X to Y breadth
  category: syntactic
  scope: general
  formats: null
  detection:
    method: judge
    unit: count
    rubric: |
      A span exhibits FROM-X-TO-Y BREADTH RHETORIC when ALL criteria hold:
      (a) the span has the form "from X to Y" (or "from X through Y"), AND
      (b) X and Y are category exemplars, not endpoints of a measurable scale, AND
      (c) the pair functions as scene-setting or scope-signalling — it gestures at everything in between
          rather than naming a specific interval the reader must use.
      EXCLUSIONS:
      (x) literal ranges do not qualify: dates ("from March to June"), page ranges, grade bands, dollar
          or percentage spans, times, ages, or any numeric interval.
      (y) literal movement or transfer does not qualify: "from the warehouse to the school", "from the
          old vendor to the new one", "from draft to final" when it names an actual process step.
      (z) a range that is later used in a calculation or a filter does not qualify.
      Evidence to extract: quote the full "from X to Y" phrase with its sentence; name X and name Y;
      state whether X and Y are exemplars or scale endpoints.
    rubric_version: 1
    judge_view: chunk
  examples:
  - From attendance clerks to cabinet members, everyone reads this report.
  - The change touches everything from intake forms to state reporting.
  counter_examples: []
  provenance:
    source: seed
    added: 2026-07-28
    run_id: null
    evidence: literature
  status: active
  weight: 1.0
  notes: null
- id: str.summary-sandwich
  name: summary sandwich
  category: structural
  scope: general
  formats: null
  detection:
    method: judge
    unit: binary
    rubric: |
      A document exhibits SUMMARY SANDWICH when BOTH criteria hold:
      (a) the opening section previews the document's structure or restates the ask ("this document will
          cover X, Y, Z"), AND
      (b) a closing section, DISTINCT from the document's last substantive section, re-summarizes
          points already made, adding no new information. A sentence appearing for the first time
          inside the final substantive section is that section's own content, not a recap of it: a
          document that simply ends on its last finding does not satisfy (b), however conclusive
          that finding sounds.
      EXCLUSIONS:
      (x) a closing section that adds a NEW decision, deadline, owner, or open question does not
          satisfy (b).
      Evidence to extract: quote the opening preview sentence(s); quote the closing recap
      sentence(s) and say whether they sit in a section separate from the last substantive one;
      quote any new-information sentence in the closing if present.
    rubric_version: 2
    judge_view: skeleton
  examples:
  - 'This memo will cover three topics: cost, timeline, and staffing.'
  - In summary, we covered cost, timeline, and staffing.
  counter_examples: []
  provenance:
    source: seed
    added: 2026-07-28
    run_id: null
    evidence: literature
  status: active
  weight: 1.0
  notes: Preview at the top, recap at the bottom, nothing new in either.
