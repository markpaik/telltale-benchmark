- id: lex.delve
  name: delve
  category: lexical
  scope: general
  formats: null
  detection:
    method: regex
    unit: count
    pattern: \bdelv(?:e|es|ed|ing)\b
    flags:
    - IGNORECASE
  examples:
  - Before we set the budget, let us delve into the enrollment data.
  - The audit delves into three years of purchasing records.
  counter_examples: []
  provenance:
    source: seed
    added: 2026-07-28
    run_id: null
    evidence: literature
  status: active
  weight: 1.0
  notes: Near-canonical LLM marker; almost absent from human business prose.
- id: lex.tapestry
  name: tapestry
  category: lexical
  scope: general
  formats: null
  detection:
    method: regex
    unit: count
    pattern: \btapestr(?:y|ies)\b(?!\s+(?:hanging|hung|woven\s+in|on\s+the\s+wall))
    flags:
    - IGNORECASE
    proper_noun_guard: true
  examples:
  - The initiative adds another thread to the district's tapestry of supports.
  - Our staffing model reflects a rich tapestry of professional backgrounds.
  counter_examples:
  - The tapestry hanging in the lobby dates to 1890.
  - Enrollment at Tapestry Charter School rose by forty students.
  provenance:
    source: seed
    added: 2026-07-28
    run_id: null
    evidence: literature
  status: active
  weight: 1.0
  notes: Metaphorical use only; literal textile references are excluded.
