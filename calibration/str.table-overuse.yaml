# Calibration set for str.table-overuse (rubric_version 1).
#
# Mini-skeletons in the shape `protocol.skeleton_view` renders — including the
# TABLES appendix, which is why that appendix exists: `textstats.doc_skeleton`
# drops tables, and this tell has no evidence without them.
#
# This is the one judge tell whose rubric is disjunctive: ANY of (a) a two-column
# Aspect/Description table whose second column holds prose, (b) a single-data-row
# table, or (c) a table whose cells are running prose. The negatives are real
# data tables, schedules, rosters, budgets, crosswalks, a required compliance
# appendix, and a document with no tables at all.
#
# Representational parity (added after the first two live rounds): these
# mini-skeletons are stored exactly as `protocol.skeleton_view` renders a real
# document, closing-paragraph labels included. They were not, before — which
# means every score recorded prior to this change was measured against a
# strictly harder representation than production uses, with the labels that help
# a judge tell a reprinted closing paragraph from a genuine recap withheld. Those
# 1.00s therefore stand as conservative rather than flattered.
tell: str.table-overuse
rubric_version: 1
view: skeleton
snippets:
  - id: pos-01
    label: positive
    source: registry
    note: registry example — criterion (a), Aspect/Description with prose
    text: |
      SKELETON sample/report-01
      format: report
      words: 640

      OUTLINE
      H1: Pilot Summary
      PARA: 58w | The pilot closed in June and came in under budget.   [this is the closing paragraph; it is printed in full below]
      H2: Findings

      FIRST PARAGRAPH
      The pilot closed in June and came in under budget. Nothing in the design changed after the second month.

      LAST PARAGRAPH [the same closing paragraph already listed in the outline above, reprinted in full — its appearance here is not a second occurrence in the document]
      The findings are summarized in the table above. A fuller treatment is in the appendix.

      TABLES
      [table 1: 4 lines]
      | Aspect | Description |
      |---|---|
      | Cost | The pilot ran under budget. |
      | Timeline | The work finished two weeks early. |

