# Calibration set for str.parallel-bullet-grammar (rubric_version 1).
#
# Mini-skeletons in the shape `protocol.skeleton_view` renders, so the LIST
# blocks carry the item openings the judge is asked to quote. The judge reports
# per-list evidence; the decision runs in code — a list of three or more items,
# one shared opening form, not one item breaking it, and no exclusion.
#
# The negatives are deliberately the near misses: a two-item list, single-word
# items, dates, numbers, a runbook, a checklist, an agenda, and two lists whose
# uniformity breaks on the last item. A judge that reads "the bullets look
# tidy" rather than the rubric fails most of them.
#
# Representational parity (added after the first two live rounds): these
# mini-skeletons are stored exactly as `protocol.skeleton_view` renders a real
# document, closing-paragraph labels included. They were not, before — which
# means every score recorded prior to this change was measured against a
# strictly harder representation than production uses, with the labels that help
# a judge tell a reprinted closing paragraph from a genuine recap withheld. Those
# 1.00s therefore stand as conservative rather than flattered.
tell: str.parallel-bullet-grammar
rubric_version: 1
view: skeleton
snippets:
  - id: pos-01
    label: positive
    source: registry
    note: registry example — all gerunds
    text: |
      SKELETON sample/memo-01
      format: memo
      words: 420

      OUTLINE
      H1: Data Team Priorities
      PARA: 46w | The working group settled on three priorities for the year.
      LIST: 3 items
        - Improving intake speed
        - Reducing manual entry
        - Strengthening data quality
      PARA: 38w | Each has an owner and a first checkpoint in October.   [this is the closing paragraph; it is printed in full below]

      FIRST PARAGRAPH
      The working group settled on three priorities for the year. None of them requires new money and all three require attention from the same two people.

      LAST PARAGRAPH [the same closing paragraph already listed in the outline above, reprinted in full — its appearance here is not a second occurrence in the document]
      Each has an owner and a first checkpoint in October. Progress will be reported in the quarterly update rather than in a separate memo.

