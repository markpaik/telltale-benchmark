- id: str.parallel-bullet-grammar
  name: parallel bullet grammar
  category: structural
  scope: general
  formats: null
  detection:
    method: judge
    unit: binary
    rubric: |
      A document exhibits PARALLEL BULLET GRAMMAR when ALL criteria hold:
      (a) a list contains three or more bullets or numbered items, AND
      (b) every item in that list opens with one of exactly these five forms, and every item uses
          the same one:
            (1) an imperative verb ("Confirm the roster"),
            (2) a gerund, "-ing" ("Improving intake speed"),
            (3) a "Noun:" lead-in ("Cost: $4.1 million") — bolded or not, since the outline
                strips emphasis,
            (4) the same opening word in every item ("Extract is complete", "Extract logs are
                retained"),
            (5) a truncated passive or participial construction, noun + past participle
                (+ modifier) ("Leading zeros stripped on write").
          This enumeration is EXHAUSTIVE. Any other resemblance between the items — that they are
          all noun phrases, all questions, all past-tense clauses, all about one topic, all of a
          similar length — does not qualify, AND
      (c) the uniformity runs to the end of the list: not one item breaks the pattern.
      EXCLUSIONS:
      (x) lists of two items do not qualify.
      (y) a list whose items are single words, proper nouns, dates, or numbers does not qualify —
          parallelism there is a property of the content, not the prose.
      (z) a list of steps in a procedure where the imperative form is required by the format (a runbook,
          a checklist, an agenda) does not qualify.
      Evidence to extract: for each qualifying list, quote the first three to five words of every item,
      in order; name which of the five forms (1)-(5) they share, or none; note the list's location
      by its heading.
    rubric_version: 2
    judge_view: skeleton
  examples:
  - |-
    - Improving intake speed
    - Reducing manual entry
    - Strengthening data quality
  - |-
    - Confirm the roster
    - Reconcile the counts
    - Publish the summary
  counter_examples: []
  provenance:
    source: seed
    added: 2026-07-28
    run_id: null
    evidence: literature
  status: active
  weight: 1.0
  notes: null
- id: str.table-overuse
  name: table overuse
  category: structural
  scope: general
  formats: null
  detection:
    method: judge
    unit: binary
    rubric: |
      A document exhibits TABLE OVERUSE when ANY criterion holds:
      (a) a markdown table has exactly two columns of the "Aspect / Description", "Item / Detail", or
          "Factor / Explanation" kind, where the second column holds prose sentences, OR
      (b) a markdown table has a single data row, so the table carries no comparison, OR
      (c) a markdown table's cells hold running prose that would read as ordinary paragraphs or bullets
          with no loss.
      EXCLUSIONS:
      (x) a genuine data table — two or more columns of numeric or categorical values, one row per
          entity — does not qualify, however many rows it has.
      (y) a schedule, roster, budget, or crosswalk whose columns are read against each other does not
          qualify.
      (z) a table required by the document's stated format (a compliance appendix, a required form) does
          not qualify.
      Evidence to extract: quote the table's header row; quote one representative data row; state the
      row count and the column count; name which criterion (a), (b), or (c) it meets.
    rubric_version: 1
    judge_view: skeleton
  examples:
  - |-
    | Aspect | Description |
    |---|---|
    | Cost | The pilot ran under budget. |
  - |-
    | Item | Detail |
    |---|---|
    | Timeline | Twelve weeks from approval to launch. |
  counter_examples: []
  provenance:
    source: seed
    added: 2026-07-28
    run_id: null
    evidence: literature
  status: active
  weight: 1.0
  notes: Tables carrying prose instead of data.
