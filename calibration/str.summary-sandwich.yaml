# Calibration set for str.summary-sandwich (rubric_version 1).
#
# Doc-level tell, so the snippets are mini-skeletons in exactly the shape
# `protocol.skeleton_view` renders: outline, first paragraph, last paragraph,
# tables. The judge extracts three quotes and the decision runs in code —
# present iff preview AND recap AND NOT new information in the close — so what
# these snippets have to be unambiguous about is which of the three quotes
# exist. Four of the negatives have both a preview and a recap and are negative
# only because the close carries something new; that is exclusion (x), and it is
# the row of the truth table most likely to be got wrong.
#
# Representational parity (added after the first two live rounds): these
# mini-skeletons are stored exactly as `protocol.skeleton_view` renders a real
# document, closing-paragraph labels included. They were not, before — which
# means every score recorded prior to this change was measured against a
# strictly harder representation than production uses, with the labels that help
# a judge tell a reprinted closing paragraph from a genuine recap withheld. Those
# 1.00s therefore stand as conservative rather than flattered.
tell: str.summary-sandwich
rubric_version: 1
view: skeleton
snippets:
  - id: pos-01
    label: positive
    source: registry
    note: registry examples as the preview and the recap
    text: |
      SKELETON sample/memo-01
      format: memo
      words: 612

      OUTLINE
      H1: Elementary Consolidation — Options for the Board
      PARA: 58w | This memo will cover three topics: cost, timeline, and staffing.
      H2: Cost
      PARA: 96w | Closing four buildings saves $4.1 million a year at current staffing.
      H2: Timeline
      PARA: 74w | The board's last actionable meeting is April 20.
      H2: Staffing
      PARA: 88w | Forty-one positions are affected, thirty of them through attrition.
      H2: Summary
      PARA: 44w | In summary, we covered cost, timeline, and staffing.   [this is the closing paragraph; it is printed in full below]

      FIRST PARAGRAPH
      This memo will cover three topics: cost, timeline, and staffing. Each section gives the range, the assumptions behind it, and the office that owns the number.

      LAST PARAGRAPH [the same closing paragraph already listed in the outline above, reprinted in full — its appearance here is not a second occurrence in the document]
      In summary, we covered cost, timeline, and staffing. The savings are real, the timeline is tight, and the staffing effect is manageable at the levels described above.

