- id: rht.rule-of-three
  name: rule of three
  category: syntactic
  scope: general
  formats: null
  detection:
    method: judge
    unit: count
    rubric: |
      A span exhibits RULE OF THREE when ALL criteria hold:
      (a) three coordinate items appear in one sentence or one clause, joined by commas and/or a final
          conjunction ("X, Y, and Z"), or as three parallel clauses of similar length, AND
      (b) the three items belong to the same grammatical form (three nouns, three verb phrases, three
          adjectives), AND
      (c) the third item adds cadence rather than information: dropping it would not remove a fact,
          a number, an owner, or a named entity from the passage.
      EXCLUSIONS:
      (x) genuinely enumerative content does not qualify — three actual budget lines, three named
          schools, three dated milestones, three people assigned to work, or any triple whose members
          carry distinct facts the reader needs.
      (y) a list rendered as bullets or numbered items is out of scope here; that is covered by the
          structural tells.
      (z) a triple quoted from a source document or from another speaker does not qualify.
      Evidence to extract: quote the full sentence; quote each of the three items separately; state in
      one clause which fact would be lost if the third item were deleted (if none, criterion (c) holds).
    rubric_version: 1
    judge_view: chunk
  examples:
  - The plan is faster, cleaner, and cheaper.
  - We need better data, better tools, and better habits.
  counter_examples: []
  provenance:
    source: seed
    added: 2026-07-28
    run_id: null
    evidence: literature
  status: active
  weight: 1.0
  notes: Tricolon used for cadence rather than enumeration.
- id: rht.rhetorical-qa
  name: rhetorical question and answer
  category: syntactic
  scope: general
  formats: null
  detection:
    method: judge
    unit: count
    rubric: |
      A span exhibits RHETORICAL Q&A when BOTH criteria hold:
      (a) the writer poses a question in their own voice — as a sentence, a heading, or a fragment
          ending in "?", AND
      (b) the writer answers it immediately, within the same paragraph or in the sentence(s) directly
          following, without any intervening turn from another speaker.
      EXCLUSIONS:
      (x) a question posed to the reader and left open — no answer supplied by the writer — does not
          qualify.
      (y) quoted dialogue, interview transcript, survey items, and FAQ documents whose stated format is
          question-and-answer do not qualify.
      (z) a question the writer explicitly defers ("we take this up in the next section") does not
          qualify.
      (w) a question addressed to a named person or directly to the recipient as genuine
          correspondence ("Marisol, did you see the revision?") does not qualify — excluded even if
          the writer immediately supplies the information.
      Evidence to extract: quote the question verbatim; quote the first sentence of the answer; note
      whether the question appears as a heading or in running prose.
    rubric_version: 2
    judge_view: chunk
  examples:
  - So why did the count change? The rule changed in November.
  - What does this mean for schools? Two fewer forms each month.
  counter_examples: []
  provenance:
    source: seed
    added: 2026-07-28
    run_id: null
    evidence: literature
  status: active
  weight: 1.0
  notes: null
