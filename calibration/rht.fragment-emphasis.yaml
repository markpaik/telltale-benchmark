# Calibration set for rht.fragment-emphasis (rubric_version 1).
#
# Business markdown is full of verbless lines that are not fragments for
# emphasis: headings, bullets, table cells, sign-offs, captions, callout tags.
# The rubric excludes all of them, so seven of the ten negatives are exactly
# those shapes. A judge that flags "any sentence without a verb" fails here,
# which is the reason the set is built this way.
tell: rht.fragment-emphasis
rubric_version: 1
view: chunk
snippets:
  - id: pos-01
    label: positive
    source: registry
    text: |
      The reconciliation script had been writing to the wrong column since the
      February release. Nobody caught the error for six weeks. Six weeks.

  - id: pos-02
    label: positive
    source: registry
    text: |
      Once we knew which column it was, the repair was trivial. The fix took one
      afternoon. One afternoon.

  - id: pos-03
    label: positive
    source: synthetic
    text: |
      We asked the vendor for the raw extract in March, then again in April, and
      once more at the end of May. Still nothing.

  - id: pos-04
    label: positive
    source: synthetic
    text: |
      The upload window closed at five o'clock on the ninth and the dashboard
      shows every building red. Every single one.

  - id: pos-05
    label: positive
    source: synthetic
    text: |
      The vendor's written answer was that the data had been complete and
      accurate at the time of transfer. Not true. Their own log shows the
      truncation happening on their side.

  - id: pos-06
    label: positive
    source: synthetic
    text: |
      Enrollment fell in every elementary building for the sixth consecutive
      year. Again. The projections we built in 2021 have been wrong in the same
      direction every year since.

  - id: pos-07
    label: positive
    source: synthetic
    text: |
      A $4 million recommendation with forty-one affected positions went from
      first reading to adoption in a single meeting. Twenty minutes.

  - id: pos-08
    label: positive
    source: synthetic
    text: |
      Close two buildings, move the sixth grade, and hold the boundaries where
      they are. That is the whole plan. All of it.

  - id: pos-09
    label: positive
    source: synthetic
    text: |
      The report went to the board with a number that had never been checked
      against the source file. Three people read it before it went out. Three.

  - id: pos-10
    label: positive
    source: synthetic
    text: |
      We can absorb one more year at this staffing level without cutting
      programs. Barely. The year after that is not survivable on the current
      revenue.

  - id: neg-01
    label: negative
